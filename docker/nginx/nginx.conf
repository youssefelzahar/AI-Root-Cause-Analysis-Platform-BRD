events {}

http {
  upstream frontend {
    server frontend:3000;
  }

  upstream backend {
    server backend:8000;
  }

  # PRD section 6 allows CSV uploads up to 200 MB. nginx defaults to 1m, which
  # would reject every upload at the gateway, so raise it with headroom for
  # multipart framing.
  client_max_body_size 210m;
  client_body_timeout 300s;
  client_body_buffer_size 1m;
  send_timeout 300s;

  server {
    listen 80;

    location /api/ {
      proxy_pass http://backend/api/;
      proxy_http_version 1.1;

      # Stream the request body straight through instead of spooling 200 MB in
      # nginx first. This drops Content-Length in favour of chunked encoding,
      # which is why the backend counts bytes itself rather than trusting the
      # header (see app/core/middleware.py).
      proxy_request_buffering off;
      proxy_buffering off;

      proxy_connect_timeout 30s;
      proxy_send_timeout 600s;
      proxy_read_timeout 600s;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
      proxy_pass http://backend/health;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
